# Quaver — Linux 前后端打包 CI
# 后端：api-server (FastAPI sidecar) → PyInstaller onefile 二进制
# 前端：ui (Electron + Vite) → AppImage（内含对应架构的 sidecar）
# 架构：x86_64 + ARM64 双矩阵。PyInstaller 不能交叉编译，ARM 必须跑在
#       GitHub 原生 ARM runner（ubuntu-24.04-arm）上，不用 QEMU。
# 触发：push 到 main / PR 出 artifact；打 v* tag 额外发布 GitHub Release。

name: Build Linux

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────── 后端 ──────────────────────────────
  backend:
    name: sidecar (${{ matrix.arch_label }})
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch_label: x86_64
            runs_on: ubuntu-24.04
          - arch_label: aarch64
            runs_on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      # 只初始化构建真正需要的子模块（uv 的 path 依赖），不去拉 Typhoeus
      - name: Init QQMusicApi submodule
        run: git submodule update --init --depth 1 vendor/QQMusicApi

      - uses: astral-sh/setup-uv@v10.1.0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"   # 与本地 uv.lock 生成环境一致（3.11/3.12 均满足 >=3.11,<3.14）

      - name: Install deps
        working-directory: api-server
        run: uv sync --frozen --no-dev

      - name: PyInstaller onefile
        working-directory: api-server
        run: |
          uv run --frozen --with pyinstaller --with pyinstaller-hooks-contrib \
            pyinstaller --clean --noconfirm --onefile \
              --name quaver-server \
              --distpath dist-bin --workpath build/pyi --specpath build/pyi \
              --hidden-import uvicorn.logging \
              --hidden-import uvicorn.loops.auto \
              --hidden-import uvicorn.loops.asyncio \
              --hidden-import uvicorn.protocols.http.auto \
              --hidden-import uvicorn.protocols.http.h11_impl \
              --hidden-import uvicorn.protocols.websockets.auto \
              --hidden-import uvicorn.protocols.websockets.wsproto_impl \
              --hidden-import uvicorn.protocols.websockets.websockets_impl \
              --hidden-import python_socks \
              --copy-metadata qqmusic-api-python \
              build_entry.py

      - name: Smoke test binary
        working-directory: api-server
        run: |
          mkdir -p "$HOME/.config/quaver"   # 无凭证文件也须能起（返回未登录）
          QUAVER_PORT=3999 ./dist-bin/quaver-server > /tmp/sidecar-ci.log 2>&1 &
          SERVER_PID=$!
          status=1
          for i in $(seq 1 30); do
            sleep 1
            if curl -fsS --max-time 3 http://127.0.0.1:3999/login/status >/dev/null 2>&1; then
              echo "sidecar OK"; status=0; break
            fi
          done
          kill $SERVER_PID 2>/dev/null
          [ "$status" = 0 ] || cat /tmp/sidecar-ci.log
          exit $status

      - name: Rename for artifact
        working-directory: api-server
        run: cp dist-bin/quaver-server dist-bin/quaver-server-$(uname -m)

      - uses: actions/upload-artifact@v7
        with:
          name: quaver-server-linux-${{ matrix.arch_label }}
          path: api-server/dist-bin/quaver-server-${{ matrix.arch_label }}

  # ────────────────────────────── 前端 ──────────────────────────────
  frontend:
    name: AppImage (${{ matrix.arch_label }})
    needs: backend
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch_label: x86_64
            electron_arch: x64
            runs_on: ubuntu-24.04
          - arch_label: aarch64
            electron_arch: arm64
            runs_on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Fetch sidecar for this arch
        uses: actions/download-artifact@v8
        with:
          name: quaver-server-linux-${{ matrix.arch_label }}
          path: api-server/dist-bin

      # extraResources 里约定文件名是 quaver-server
      - name: Stage sidecar
        working-directory: api-server/dist-bin
        run: |
          mv quaver-server-${{ matrix.arch_label }} quaver-server
          chmod +x quaver-server

      - name: npm ci
        working-directory: ui
        run: npm ci

      - name: Build dist (tsc + vite)
        working-directory: ui
        run: npm run build

      - name: electron-builder AppImage
        working-directory: ui
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARGS="--linux AppImage --${{ matrix.electron_arch }} --publish never"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            ARGS="$ARGS --config.extraMetadata.version=${GITHUB_REF#refs/tags/v}"
          fi
          npx electron-builder $ARGS

      - uses: actions/upload-artifact@v7
        with:
          name: quaver-appimage-${{ matrix.arch_label }}
          path: ui/release/Quaver-*.AppImage
          if-no-files-found: error

  # ───────────────────────────── Release ─────────────────────────────
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: "quaver-*"
          merge-multiple: true
          path: out

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la out/
          chmod +x out/quaver-server-* out/Quaver-*.AppImage 2>/dev/null || true
          gh release create "$GITHUB_REF_NAME" \
            --generate-notes \
            out/quaver-server-* out/Quaver-*.AppImage
