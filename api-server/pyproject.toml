[project]
name = "quaver-api-server"
version = "0.1.0"
description = "Quaver 本地 API sidecar — 基于 L-1124/QQMusicApi (Python, GPLv3+) 的薄适配层"
requires-python = ">=3.11,<3.14"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
  "fastapi>=0.136",
  "uvicorn>=0.46",
  "pydantic>=2.13",
  "loguru>=0.7.3",
  "qqmusic-api-python",
  "quaver-typhoeus",
]

[tool.uv.sources]
# 直接吃仓库内 vendor 的上游源码（GPLv3+）；升级 = git -C vendor/QQMusicApi pull
qqmusic-api-python = { path = "../vendor/QQMusicApi", editable = true }
# Typhoeus 播放后端核心（本仓库 submodule，AGPLv3+）；editable 保证改 submodule 即生效
quaver-typhoeus = { path = "../vendor/Typhoeus", editable = true }

[tool.ruff]
line-length = 120
